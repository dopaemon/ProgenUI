services:
  frontend:
    build:
      context: ./frontend
    environment:
      REACT_APP_API_BASE_URL: /api
    depends_on:
      - backend
    networks:
      - progenui

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:///./data/progenui.db
      JWT_SECRET: change-me-in-production
      JWT_ACCESS_MINUTES: 30
      JWT_REFRESH_MINUTES: 10080
      BRIDGE_BASE_URL: http://bridge:8081
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      CORS_ORIGINS: http://localhost,http://localhost:3000
    volumes:
      - backend_data:/app/data
    depends_on:
      - bridge
    networks:
      - progenui

  bridge:
    build:
      context: ./bridge
    environment:
      XRAY_BINARY: /usr/local/bin/xray
      XRAY_CONFIG_PATH: /etc/xray/config.json
      XRAY_API_PORT: "10085"
      PORT: "8081"
    networks:
      - progenui

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - progenui

volumes:
  backend_data:

networks:
  progenui:
